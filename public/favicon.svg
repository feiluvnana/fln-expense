<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded cozy background badge -->
  <rect width="48" height="48" rx="12" fill="#FAF2E8" />
  <circle cx="24" cy="24" r="21" fill="#FAF2E8" stroke="#F1DCC9" stroke-width="1.5" />

  <!-- Dứa's Ginger Ears -->
  <path d="M12 21L15 8L23 15" fill="#E27432" />
  <path d="M15 17L17 11L21 15" fill="#FBBF94" />
  <path d="M36 21L33 8L25 15" fill="#E27432" />
  <path d="M33 17L31 11L27 15" fill="#FBBF94" />

  <!-- Head shape -->
  <path d="M12 24C12 17.5 17.5 12 24 12C30.5 12 36 17.5 36 24C36 30.5 30.5 35 24 35C17.5 35 12 30.5 12 24Z" fill="#E8823D" />

  <!-- Tabby markings on forehead -->
  <path d="M24 14V19" stroke="#C9601F" stroke-width="1.5" stroke-linecap="round" />
  <path d="M20 15L21.5 19" stroke="#C9601F" stroke-width="1.2" stroke-linecap="round" />
  <path d="M28 15L26.5 19" stroke="#C9601F" stroke-width="1.2" stroke-linecap="round" />

  <!-- White muzzle & cheeks (like Dứa in the photo) -->
  <path d="M15 25C15 22.5 17.5 21 21 21C22.5 21 23.5 21.8 24 22.5C24.5 21.8 25.5 21 27 21C30.5 21 33 22.5 33 25C33 29 29.5 33 24 33C18.5 33 15 29 15 25Z" fill="#FFFDF9" />

  <!-- Sleeping Eyes (curved peaceful arcs) -->
  <path d="M18 23C19 21.5 21 21.5 22 23" stroke="#523927" stroke-width="1.6" stroke-linecap="round" />
  <path d="M26 23C27 21.5 29 21.5 30 23" stroke="#523927" stroke-width="1.6" stroke-linecap="round" />

  <!-- Sweet pink nose -->
  <polygon points="24,25 22.8,26.6 25.2,26.6" fill="#F8719D" />

  <!-- Cat mouth lines -->
  <path d="M24 26.6V28M24 28C23.2 28.8 21.8 28.8 21 28M24 28C24.8 28.8 26.2 28.8 27 28" stroke="#523927" stroke-width="1.2" stroke-linecap="round" />

  <!-- Cute paw peeking -->
  <circle cx="34" cy="34" r="5" fill="#FFFDF9" stroke="#F1DCC9" stroke-width="1" />
  <circle cx="33" cy="33" r="1.5" fill="#FBBF94" />
</svg>
